[project]
name = "clef"
version = "0.1.0"
description = "Web UI and API for the Clef-Flash decision model on llama.cpp, with CSV evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
clef = "clef:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
